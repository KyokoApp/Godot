name: apk
# Build APK A-Sekai.
# Gerbang WAJIB di urutan ini:
#   1. lint sintaks + cek inferensi tipe (cepat, tanpa Godot)
#   2. import proyek  (Godot mengisi cache .godot/)
#   3. UJI COMPILE    (SEMUA .gd, dengan engine sungguhan)
#   4. baru ekspor APK
# Langkah 3 dulu tidak ada, dan itulah sebabnya bug "layar biru" lolos
# sampai ke HP pengguna. Jangan dihapus.
#
# Kenapa dipecah jadi beberapa pekerjaan PARALEL:
# update project ini nyicil (satu perubahan kecil = satu push), tapi build lama
# ± 8 menit dan hampir seluruhnya di render Mobile Vulkan software (lavapipe,
# runner 2 core). Render itu saling independen, jadi:
#   gate      : lint + compile + SEMUA tes headless  (± 2 menit, gagal dulu)
#   render-a/b: render Mobile Vulkan, dibagi 3        (± 2,5 menit, paralel)
#   render-c  : render avatar + dunia                (± 2,5 menit, paralel)
#   package   : export PCK + APK + audit + rilis     (TUNGGU gate hijau)
#   ringkasan : komentar angka/pratinjau/log gagal   (selalu jalan)
# Aturan lama "compile lolos dulu, baru ekspor APK" tetap dijaga: `package`
# menunggu `gate`. Render sengaja TIDAK menunggu gate supaya push kecil tidak
# menunggu dua kali — kalau gate gagal, render ikut gagal dan itu memang signal.

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

concurrency: apk

permissions:
  contents: write

env:
  GVER: 4.5.2

jobs:
  # ---------------------------------------------------------------- gate ----
  # Semua gerbang tanpa render: ini yang menentukan "boleh lanjut atau tidak".
  gate:
    name: gate (lint + compile + tes headless)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Aset biner besar (FBX avatar + tekstur + pustaka UAL) tidak disimpan di
      # git; diambil dari lampiran rilis `assets-v1` (cadangan: riwayat git).
      - name: Ambil aset biner
        # Log-nya ditee ke berkas: langkah ini pernah gagal karena jaringan dan
        # tanpa log-nya tidak ada cara tahu berkas mana yang gagal. Ekornya
        # dikirim di komentar commit "angka penting" (langkah itu if: always()).
        run: |
          set -o pipefail
          tools/fetch_assets.sh 2>&1 | tee fetch-assets.log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- 1. lint + cek tipe -------------------------------------------
      - name: Lint GDScript (gdparse)
        run: |
          pip install -q gdtoolkit
          FAIL=0
          for f in $(find project tools -name "*.gd"); do
            if ! out=$(gdparse "$f" 2>&1); then
              echo "::error::parse error di $f :: $(echo "$out" | head -5 | tr '\n' ' ')"
              FAIL=1
            fi
          done
          [ "$FAIL" = 0 ] && echo "semua .gd lolos parse" || exit 1
          gdlint project tools
          # Cek inferensi tipe. gdparse hanya cek sintaks, dan kelas bug
          # yang muncul di device adalah 'Cannot infer the type of ...'.
          python3 tools/check_scripts.py .
          python3 tools/check_license_bundle.py
          python3 tools/test_chunk_content.py
          # Gerbang tanpa engine: 85 klip UAL + ukur ulang langkah kaki.
          python3 tools/check_animation_catalog.py
          # Berkas wajib ada. Satu commit pernah membawa indeks klon yang rusak
          # (berkas hilang, versi lama kembali); kegagalannya baru muncul di
          # langkah ambil aset dengan pesan yang menyesatkan. Daftar ini membuat
          # "pohon berkas ter-revert" ketahuan dalam hitungan detik.
          for wajib in tools/fetch_assets.sh tools/render_mannequin.gd \
                tools/test_skin_shell.gd tools/test_camera_zoom.gd \
                tools/test_scenery.gd tools/test_island.gd \
                tools/render_world.gd \
                tools/test_contact_shadows.gd \
                tools/test_world_tree.gd \
                project/src/game/world/scenery.gd \
                project/src/game/world/world_tree.gd \
                project/src/game/world/water.gdshader \
                project/src/game/mannequin.gd \
                project/src/game/character/skin_shell.gd \
                project/src/game/character/skin_shell.gdshader \
                .github/workflows/assets.yml; do
            [ -f "$wajib" ] || { echo "::error::berkas wajib hilang: $wajib"; exit 1; }
          done
          # Karakter FBX sudah dibuang; kalau berkas ini muncul lagi berarti
          # pohon berkas ter-revert ke commit lama.
          for sisa in project/src/game/character/aurelia_visual.gd \
                project/src/game/animation/cloth_springs.gd aurelia-debug; do
            [ ! -e "$sisa" ] \
              || { echo "::error::sisa karakter FBX muncul lagi: $sisa"; exit 1; }
          done

      # --- 2. dependensi + Godot ----------------------------------------
      - name: Dependensi sistem
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxkbcommon0 libxinerama1 libxcursor1 libxi6 \
            libxrandr2 libxext6 libxrender1 libgl1 libegl1 libasound2 \
            fontconfig libfontconfig1 unzip zip xvfb xauth mesa-vulkan-drivers

      - name: Unduh Godot 4.5.2
        run: |
          curl -sL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_linux.x86_64.zip"
          unzip -qo godot.zip
          mv Godot_v${GVER}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import proyek
        run: ./godot --headless --path project --import --editor --quit

      # --- 3. GERBANG: compile semua skrip ------------------------------
      - name: "Uji COMPILE semua skrip (gerbang wajib)"
        run: |
          timeout 300 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/compile_check.gd" 2>&1 | tee compile.log
          if ! grep -q "HASIL: OK" compile.log; then
            echo "::error::compile check GAGAL"
            grep -E "SCRIPT ERROR|Parse Error|compile-check|at:" compile.log | head -60 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "semua skrip lolos kompilasi engine"

      - name: Uji 85 klip animasi ada di berkas GLB (headless)
        run: |
          set +e
          timeout 90 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_clips.gd" 2>&1 | tee clips-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' clips-test.log; then
            grep -E "::error::|ERROR|clips-test" clips-test.log | head -30 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[clips-test] HASIL: OK' clips-test.log

      - name: Tes joystick dan gerak (headless)
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_movement.gd" 2>&1 | tee movement-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' movement-test.log; then
            grep -E "::error::|ERROR|movement-test" movement-test.log | head -10 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Tes karakter dan animasi tulang
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_mannequin.gd" 2>&1 | tee mannequin-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' mannequin-test.log; then
            grep -E "::error::|ERROR|mannequin-test" mannequin-test.log | head -10 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      # Kulit beranimasi: salinan mesh yang selalu menimpa mannequin.
      - name: Tes kulit beranimasi mannequin (headless)
        run: |
          set +e
          timeout 300 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_skin_shell.gd" 2>&1 | tee skin-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' skin-test.log; then
            tail -60 skin-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      # Pemandangan di luar pulau: bukit, laut, tebing, reruntuhan, kunang.
      # Gerbang ini murni angka (tanpa render) supaya cepat dijalankan.
      - name: Tes pemandangan dunia (headless)
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_scenery.gd" 2>&1 | tee scenery-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' scenery-test.log; then
            tail -60 scenery-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[scenery-test]' scenery-test.log
          grep -F '[skin-test]' skin-test.log

      # Bentuk pulau 1 km: tidak bulat, tidak kotak, air di luar, tanah di dalam.
      # Ini gerbang permintaan "world 1km bergelombang kayak pulau".
      - name: Tes bentuk pulau 1 km (headless)
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_island.gd" 2>&1 | tee island-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' island-test.log; then
            tail -60 island-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[island-test]' island-test.log

      # Zoom kamera: cubit dua jari harus benar-benar menempel ke karakter.
      - name: Tes zoom kamera (headless)
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_camera_zoom.gd" 2>&1 | tee zoom-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' zoom-test.log; then
            tail -60 zoom-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[camera-zoom-test]' zoom-test.log

      - name: Tes kontak tapak api 3D (headless)
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_motion_flair.gd" 2>&1 | tee motion-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' motion-test.log; then
            tail -60 motion-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[motion-flair-test] HASIL: OK' motion-test.log

      - name: Tes mannequin dan kontrol performa
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_performance.gd" 2>&1 | tee performance-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' performance-test.log; then
            tail -40 performance-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[performance-test] HASIL: OK' performance-test.log

      - name: Tes pet api, attack, collision dan cleanup
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_fire_pet.gd" 2>&1 | tee fire-pet-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' fire-pet-test.log; then
            tail -40 fire-pet-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[fire-pet-test] HASIL: OK' fire-pet-test.log

      - name: Tes mask dan streaming rumput
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_grass.gd" 2>&1 | tee grass-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' grass-test.log; then
            tail -40 grass-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[grass-test] HASIL: OK' grass-test.log

      - name: Rekam alur animasi lompat (headless)
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_jump_trace.gd" 2>&1 | tee jump-trace.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep -E "\[jump-trace\]" jump-trace.log | head -40 \
            | while IFS= read -r line; do echo "::notice::$line"; done
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' jump-trace.log; then
            grep -E "::error::|ERROR" jump-trace.log | head -10 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[jump-trace] HASIL: OK' jump-trace.log

      - name: Tes speed, boost dan anti-meluncur
        run: |
          set +e
          timeout 180 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_speed.gd" 2>&1 | tee speed-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' speed-test.log; then
            tail -10 speed-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[speed-test] HASIL: OK' speed-test.log

      - name: Tes audio mixer, jarak, panning, occlusion dan langkah
        run: |
          set +e
          timeout 180 ./godot --headless --audio-driver Dummy --path project \
            --script "$GITHUB_WORKSPACE/tools/test_audio.gd" 2>&1 | tee audio-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' audio-test.log; then
            tail -50 audio-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[audio-test] HASIL: OK' audio-test.log

      - name: Tes validasi updater
        run: |
          timeout 60 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_update.gd"
          timeout 60 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_chunks.gd"
          timeout 60 ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/test_launcher.gd"

      # Log dikumpulkan jadi artefak supaya pekerjaan `ringkasan` bisa mengirim
      # angka penting + log lengkap walau gerbang ini yang gagal.
      - name: Simpan log gerbang
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-gate
          path: |
            *.log
          if-no-files-found: ignore

  # ------------------------------------------------------------- render ----
  # Render Mobile Vulkan software = ± 5 menit dari build lama. Dibagi tiga
  # pekerjaan berimbang (± 100 detik masing-masing) supaya jalan bersamaan.
  render-a:
    name: render-a (rumput, api, casting, tapak, sinar, senja)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ambil aset biner
        run: |
          set -o pipefail
          tools/fetch_assets.sh 2>&1 | tee fetch-assets.log
      - name: Dependensi sistem
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxkbcommon0 libxinerama1 libxcursor1 libxi6 \
            libxrandr2 libxext6 libxrender1 libgl1 libegl1 libasound2 \
            fontconfig libfontconfig1 unzip zip xvfb xauth mesa-vulkan-drivers
      - name: Unduh Godot 4.5.2
        run: |
          curl -sL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_linux.x86_64.zip"
          unzip -qo godot.zip
          mv Godot_v${GVER}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
      - name: Import proyek
        run: ./godot --headless --path project --import --editor --quit

      - name: Render shader rumput (Mobile Vulkan software)
        run: |
          set +e
          timeout 180 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --audio-driver Dummy --resolution 480x270 \
            --script "$GITHUB_WORKSPACE/tools/test_grass.gd" -- --render 2>&1 | tee grass-render.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -Eq 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' grass-render.log; then
            tail -40 grass-render.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[grass-test] HASIL: OK' grass-render.log

      - name: Render projectile dan impact (Mobile Vulkan software)
        run: |
          set +e
          timeout 180 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --audio-driver Dummy --resolution 480x270 \
            --script "$GITHUB_WORKSPACE/tools/test_fire_render.gd" 2>&1 | tee fire-render.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -Eq 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' fire-render.log; then
            tail -40 fire-render.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[fire-render-test] HASIL: OK' fire-render.log

      - name: Simpan screenshot regresi VFX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-render-screenshots
          path: ~/.local/share/godot/app_userdata/**/fire-*-test.png
          if-no-files-found: ignore

      - name: Render casting upper-body dan pemulihan pose (Mobile Vulkan)
        run: |
          set +e
          timeout 180 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --audio-driver Dummy --resolution 480x270 \
            --script "$GITHUB_WORKSPACE/tools/test_cast_render.gd" 2>&1 | tee cast-render.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -Eq 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' cast-render.log; then
            tail -60 cast-render.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[cast-render-test] HASIL: OK' cast-render.log

      - name: Render tapak api 3D (Mobile Vulkan)
        run: |
          set +e
          timeout 180 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --audio-driver Dummy --resolution 480x270 \
            --script "$GITHUB_WORKSPACE/tools/test_motion_flair_render.gd" 2>&1 | tee motion-render.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -Eq 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' motion-render.log; then
            tail -60 motion-render.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[motion-flair-render-test] HASIL: OK' motion-render.log

      - name: Render sinar matahari dan occlusion (Mobile Vulkan)
        run: |
          set +e
          timeout 180 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --audio-driver Dummy --resolution 480x270 \
            --script "$GITHUB_WORKSPACE/tools/test_sun_rays.gd" 2>&1 | tee sun-rays.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -Eq 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' sun-rays.log; then
            tail -60 sun-rays.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[sun-rays-test] HASIL: OK' sun-rays.log

      - name: Render contact shadow dan arah bayangannya (Mobile Vulkan)
        run: |
          set +e
          timeout 180 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --audio-driver Dummy --resolution 480x270 \
            --script "$GITHUB_WORKSPACE/tools/test_contact_shadows.gd" 2>&1 | tee contact-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -Eq 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' contact-test.log; then
            tail -60 contact-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[contact-test] HASIL: OK' contact-test.log

      - name: Render langit senja, awan, matahari dan keterbacaan tanah (Mobile Vulkan)
        run: |
          set +e
          timeout 180 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --audio-driver Dummy --resolution 480x270 \
            --script "$GITHUB_WORKSPACE/tools/test_dusk.gd" 2>&1 | tee dusk-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -Eq 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' dusk-test.log; then
            tail -50 dusk-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[dusk-test] HASIL: OK' dusk-test.log

      - name: "Render pohon raksasa: berdiri di darat, hijau, murah (Mobile Vulkan)"
        run: |
          set +e
          timeout 180 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --audio-driver Dummy --resolution 480x270 \
            --script "$GITHUB_WORKSPACE/tools/test_world_tree.gd" 2>&1 | tee world-tree.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -Eq 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' world-tree.log; then
            tail -50 world-tree.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[world-tree-test] HASIL: OK' world-tree.log

      - name: Simpan screenshot sinar matahari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sun-rays-screenshots
          path: ~/.local/share/godot/app_userdata/**/sun-rays-test.png
      - name: Simpan screenshot contact shadow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-shadow-screenshots
          path: ~/.local/share/godot/app_userdata/**/contact-shadow-*.png
          if-no-files-found: ignore
      - name: Simpan screenshot pohon raksasa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-tree-screenshots
          path: ~/.local/share/godot/app_userdata/**/world-tree-test.png
          if-no-files-found: ignore

      - name: Simpan screenshot motion flair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-flair-screenshots
          path: ~/.local/share/godot/app_userdata/**/motion-*-test.png
          if-no-files-found: ignore

      - name: Simpan screenshot casting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casting-screenshots
          path: ~/.local/share/godot/app_userdata/**/casting-*-test.png
          if-no-files-found: ignore

      - name: Simpan screenshot senja
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots
          path: ~/.local/share/godot/app_userdata/**/dusk-*-test.png
          if-no-files-found: ignore

      # JPEG pratinjau dibuat DI SINI (bukan di pekerjaan ringkasan) supaya
      # ringkasan tidak perlu mengunduh Godot lagi.
      - name: Pratinjau casting (JPEG untuk komentar)
        if: always()
        run: |
          shopt -s globstar nullglob
          SHOTS=(~/.local/share/godot/app_userdata/**/casting-*-test.png)
          if [ ${#SHOTS[@]} -eq 0 ]; then
            echo "tidak ada screenshot casting untuk pratinjau"
            exit 0
          fi
          mkdir -p preview
          cp "${SHOTS[@]}" preview/
          ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/make_preview.gd" -- "$PWD/preview" 560 \
            > /dev/null 2>&1 || true
      - name: Simpan pratinjau casting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-casting
          path: preview/*.jpg
          if-no-files-found: ignore

      - name: Simpan log render-a
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-render-a
          path: |
            *.log
          if-no-files-found: ignore

  render-b:
    name: render-b (HUD + warmup GPU)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ambil aset biner
        run: |
          set -o pipefail
          tools/fetch_assets.sh 2>&1 | tee fetch-assets.log
      - name: Dependensi sistem
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxkbcommon0 libxinerama1 libxcursor1 libxi6 \
            libxrandr2 libxext6 libxrender1 libgl1 libegl1 libasound2 \
            fontconfig libfontconfig1 unzip zip xvfb xauth mesa-vulkan-drivers
      - name: Unduh Godot 4.5.2
        run: |
          curl -sL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_linux.x86_64.zip"
          unzip -qo godot.zip
          mv Godot_v${GVER}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
      - name: Import proyek
        run: ./godot --headless --path project --import --editor --quit

      - name: Tes HUD dan multitouch jalan + attack (Mobile Vulkan)
        run: |
          set +e
          timeout 420 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --audio-driver Dummy --resolution 640x360 \
            --script "$GITHUB_WORKSPACE/tools/test_hud.gd" -- --render 2>&1 | tee hud-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -Eq 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' hud-test.log; then
            echo "::error::HUD engine exit status: $STATUS"
            tail -50 hud-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[hud-test] HASIL: OK' hud-test.log

      - name: Simpan screenshot HUD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-screenshots
          path: ~/.local/share/godot/app_userdata/**/hud-*-test.png
          if-no-files-found: ignore

      - name: Tes warmup GPU, skip, boot marker dan cleanup (Mobile Vulkan)
        run: |
          set +e
          timeout 240 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --audio-driver Dummy --resolution 480x270 \
            --script "$GITHUB_WORKSPACE/tools/test_warmup.gd" 2>&1 | tee warmup-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -Eq 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' warmup-test.log; then
            tail -60 warmup-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[warmup-test] HASIL: OK' warmup-test.log
          grep -F '[warmup-test] report=' warmup-test.log | while IFS= read -r line; do echo "::notice::$line"; done

      - name: Simpan log render-b
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-render-b
          path: |
            *.log
          if-no-files-found: ignore

  render-c:
    name: render-c (avatar dekat + pemandangan dunia)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ambil aset biner
        run: |
          set -o pipefail
          tools/fetch_assets.sh 2>&1 | tee fetch-assets.log
      - name: Dependensi sistem
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxkbcommon0 libxinerama1 libxcursor1 libxi6 \
            libxrandr2 libxext6 libxrender1 libgl1 libegl1 libasound2 \
            fontconfig libfontconfig1 unzip zip xvfb xauth mesa-vulkan-drivers
      - name: Unduh Godot 4.5.2
        run: |
          curl -sL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_linux.x86_64.zip"
          unzip -qo godot.zip
          mv Godot_v${GVER}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
      - name: Import proyek
        run: ./godot --headless --path project --import --editor --quit

      # Render avatar dari kamera pemain (0,4 m / 0,85 m / 2,2 m + pose jalan):
      # bug material & kain hanya terlihat dari gambar, bukan dari angka.
      - name: Render avatar dekat (Mobile Vulkan software)
        run: |
          set +e
          timeout 240 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --script "$GITHUB_WORKSPACE/tools/render_mannequin.gd" 2>&1 | tee avatar-render.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' avatar-render.log; then
            tail -60 avatar-render.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[avatar-render-test] HASIL: OK' avatar-render.log

      # Lima sudut pandang dunia (pulau/pemandangan/pantai/jalan/laut) supaya
      # bentuk pulau, garis pantai, jalur tanah, dan laut benar-benar terlihat
      # di gambar.
      - name: Render pemandangan dunia (Mobile Vulkan software)
        run: |
          set +e
          timeout 300 xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            ./godot --path project --rendering-method mobile --rendering-driver vulkan \
            --script "$GITHUB_WORKSPACE/tools/render_world.gd" 2>&1 | tee world-render.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' world-render.log; then
            tail -60 world-render.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[world-render-test] HASIL: OK' world-render.log

      - name: Simpan screenshot dunia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-screenshots
          path: ~/.local/share/godot/app_userdata/**/world-*-test.png
          if-no-files-found: ignore

      - name: Simpan screenshot avatar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-screenshots
          path: ~/.local/share/godot/app_userdata/**/avatar-*-test.png
          if-no-files-found: ignore

      - name: Pratinjau avatar + dunia (JPEG untuk komentar)
        if: always()
        run: |
          shopt -s globstar nullglob
          SHOTS=(~/.local/share/godot/app_userdata/**/avatar-*-test.png \
            ~/.local/share/godot/app_userdata/**/world-*-test.png)
          if [ ${#SHOTS[@]} -eq 0 ]; then
            echo "tidak ada screenshot untuk pratinjau"
            exit 0
          fi
          mkdir -p preview
          cp "${SHOTS[@]}" preview/
          ./godot --headless --path project \
            --script "$GITHUB_WORKSPACE/tools/make_preview.gd" -- "$PWD/preview" 560 \
            > /dev/null 2>&1 || true
      - name: Simpan pratinjau avatar + dunia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-avatar-world
          path: preview/*.jpg
          if-no-files-found: ignore

      - name: Simpan log render-c
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-render-c
          path: |
            *.log
          if-no-files-found: ignore

  # ------------------------------------------------------------ package ----
  # Ekspor + rilis. Menunggu `gate`: aturan lama "compile lolos dulu, baru
  # ekspor APK" tidak boleh hilang hanya karena build-nya diparalelkan.
  package:
    name: package (PCK + APK + rilis)
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ambil aset biner
        run: |
          set -o pipefail
          tools/fetch_assets.sh 2>&1 | tee fetch-assets.log
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependensi sistem
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxkbcommon0 libxinerama1 libxcursor1 libxi6 \
            libxrandr2 libxext6 libxrender1 libgl1 libegl1 libasound2 \
            fontconfig libfontconfig1 unzip zip xvfb xauth mesa-vulkan-drivers
      - name: Unduh Godot 4.5.2
        run: |
          curl -sL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_linux.x86_64.zip"
          unzip -qo godot.zip
          mv Godot_v${GVER}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
      - name: Siapkan keystore debug
        run: |
          mkdir -p "$HOME/.config/godot" build
          # Keystore PERMANEN ikut repo. Kalau di-generate tiap build, tiap
          # APK punya kunci berbeda dan Android menolak install di atas app
          # lama -> "bentrok"/konflik, user tidak bisa update.
          if [ ! -f "keystore/debug.keystore" ]; then
            echo "::error::keystore/debug.keystore hilang — signature akan berubah"
            exit 1
          fi
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<SEOF
          [gd_resource type="EditorSettings" format=1]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/keystore/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SEOF
      - name: Unduh template ekspor Android
        run: |
          curl -fL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GVER}.stable"
          unzip -jo templates.tpz templates/android_debug.apk \
            -d "$HOME/.local/share/godot/export_templates/${GVER}.stable"
      - name: Import proyek
        run: ./godot --headless --path project --import --editor --quit

      - name: Export content pack
        run: |
          mkdir -p build
          ./godot --headless --path project --export-pack "Content" \
            "$GITHUB_WORKSPACE/build/content.pck"
          python3 tools/make_manifest.py
          python3 tools/chunk_content.py
          mkdir -p build/pack-test
          timeout 60 ./godot --headless --path build/pack-test \
            --script "$GITHUB_WORKSPACE/tools/test_pack.gd" -- "$GITHUB_WORKSPACE/build/content.pck"

      # --- 4. ekspor ---------------------------------------------------
      - name: Export APK
        run: |
          mkdir -p build
          ./godot --headless --path project \
            --export-debug "Android" "$GITHUB_WORKSPACE/build/asekai.apk" \
            2>&1 | tee build/export.log
          test -f build/asekai.apk || { echo "::error::APK tidak terbentuk"; exit 1; }
          ls -la build/asekai.apk
          set +e
          python3 -u tools/test_incremental_export.py 2>&1 | tee build/incremental-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' build/incremental-test.log; then
            tail -10 build/incremental-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[incremental-export] HASIL: OK' build/incremental-test.log
          grep -F '[incremental-export] script-only delta:' build/incremental-test.log | while IFS= read -r line; do echo "::notice::$line"; done

      - name: Audit isi APK (berkas launcher wajib ada)
        run: |
          rm -rf build/apk-audit
          mkdir -p build/apk-audit
          (cd build/apk-audit && unzip -q ../asekai.apk)
          echo "::notice::berkas di assets: $(find build/apk-audit/assets -type f | wc -l)"
          missing=0
          # Skrip/adegan boleh ada sebagai sumber (.gd/.tscn) ATAU bentuk ekspor
          # (.gdc bytecode + .remap); yang penting salah satunya benar-benar ada.
          require() {
            label="$1"
            shift
            for candidate in "$@"; do
              if [ -f "build/apk-audit/assets/$candidate" ]; then
                echo "::notice::ADA assets/$candidate"
                return 0
              fi
            done
            echo "::error::HILANG dari APK: $label"
            missing=1
          }
          require "launcher/main.tscn" launcher/main.tscn launcher/main.tscn.remap
          require "launcher/launcher.gd" launcher/launcher.gdc launcher/launcher.gd launcher/launcher.gd.remap
          require "launcher/backdrop.gd" launcher/backdrop.gdc launcher/backdrop.gd launcher/backdrop.gd.remap
          require "launcher/chunk_policy.gd" launcher/chunk_policy.gdc launcher/chunk_policy.gd launcher/chunk_policy.gd.remap
          require "launcher/chunk_store.gd" launcher/chunk_store.gdc launcher/chunk_store.gd launcher/chunk_store.gd.remap
          require "launcher/boot_trace.gd" launcher/boot_trace.gdc launcher/boot_trace.gd launcher/boot_trace.gd.remap
          require "bootstrap/base.pck" bootstrap/base.pck
          require "bootstrap/base.json" bootstrap/base.json
          # Ilustrasi tidak wajib: kalau tidak ikut, launcher memakai latar polos.
          if [ -f build/apk-audit/assets/launcher/art/loading.jpg.remap ] \
              || [ -f build/apk-audit/assets/launcher/art/loading.jpg ]; then
            echo "::notice::ilustrasi loading ikut ke APK"
          else
            echo "::notice::ilustrasi loading TIDAK ikut (launcher pakai latar polos)"
          fi
          find build/apk-audit/assets/launcher build/apk-audit/assets/bootstrap -type f \
            | sort | while IFS= read -r line; do echo "::notice::$line"; done
          test "$missing" = 0 || exit 1

      - name: Uji boot launcher dari isi APK (headless)
        run: |
          set +e
          timeout 90 ./godot --headless --path build/apk-audit/assets \
            --script "$GITHUB_WORKSPACE/tools/test_apk_launcher.gd" 2>&1 | tee apk-launcher.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != 0 ] || grep -q 'SCRIPT ERROR' apk-launcher.log; then
            grep -E "::error::|ERROR|apk-launcher-test" apk-launcher.log | head -20 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -F '[apk-launcher-test] HASIL: OK' apk-launcher.log

      - name: Simpan log package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-package
          path: |
            *.log
            build/*.log
          if-no-files-found: ignore

      - name: Terbitkan build ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(sha256sum build/asekai.apk | cut -d' ' -f1)
          echo "$SHA  asekai.apk" > build/asekai.apk.sha256
          TAG="build-$(git rev-parse --short HEAD)"
          {
            echo "## A-Sekai — build \`$(git rev-parse --short HEAD)\`"
            echo
            echo "Updater v2: pasang APK ini sekali menimpa app lama (jangan uninstall). Update berikutnya hanya blok berubah."
            echo "Install: unduh \`asekai.apk\` -> izinkan sumber tak dikenal -> buka."
            echo
            echo '```'
            echo "$SHA  asekai.apk"
            echo '```'
          } > build/NOTES.md
          gh release create "$TAG" build/asekai.apk build/asekai.apk.sha256 \
            build/content.pck build/content.json build/content-v2.json build/chunks/*.bin \
            --target "$GITHUB_SHA" --title "A-Sekai $TAG" \
            --notes-file build/NOTES.md \
            || gh release upload "$TAG" build/asekai.apk build/asekai.apk.sha256 \
              build/content.pck build/content.json build/content-v2.json build/chunks/*.bin --clobber
          echo "rilis: $TAG"

  # ----------------------------------------------------------- ringkasan ----
  # Semua komentar commit (angka penting, pratinjau, log gagal) pindah ke sini.
  # Dulu ia menempel di pekerjaan yang sama dengan tesnya, jadi kalau tes gagal
  # di tengah, angka diagnostik ikut hilang. Sekarang pekerjaan ini `if: always()`
  # dan mengumpulkan artefak log dari SEMUA pekerjaan.
  ringkasan:
    name: ringkasan (komentar commit)
    needs: [gate, render-a, render-b, render-c, package]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Unduh artefak log + pratinjau
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Kumpulkan log ke satu folder
        run: |
          mkdir -p alllogs
          find artifacts -name '*.log' -print0 | while IFS= read -r -d '' f; do
            flat=$(echo "$f" | sed -e 's|^artifacts/||' -e 's|/|_|g')
            cp "$f" "alllogs/$flat"
          done
          echo "log terkumpul: $(ls alllogs | wc -l)"
          ls alllogs | sed 's/^/  log: /'

      # Angka-angka penting selalu dikirim sebagai komentar (ringkasan kegagalan
      # hanya jalan saat gagal, jadi tanpa ini nilai diagnostik hilang di run
      # yang hijau — dan justru itu yang perlu dilihat saat mencari sisa bug).
      - name: Ringkasan angka (komentar commit)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### angka penting (run $GITHUB_RUN_ID, commit \`${GITHUB_SHA:0:7}\`)"
            echo
            echo '```'
            grep -hE '\[skin-test\]|kulit:|biaya avatar|camera-zoom-test|gerak klip|tinggi avatar|katalog klip' \
              alllogs/*.log 2>/dev/null | tail -40
            grep -hE '\[scenery-test\]|\[world-render-test\]|\[island-test\]' \
              alllogs/*.log 2>/dev/null | tail -30
            grep -hE '\[dusk-test\]|\[sun-rays-test\]|\[contact-test\]|\[world-tree-test\]' \
              alllogs/*.log 2>/dev/null | tail -10
            echo '```'
            if [ -s alllogs/gate_fetch-assets.log ]; then
              echo
              echo '### aset biner (ekor log)'
              echo
              echo '```'
              tail -6 alllogs/gate_fetch-assets.log
              echo '```'
            fi
          } > numbers.md
          jq -Rs '{body: .}' numbers.md > numbers.json
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --input numbers.json --jq '.html_url' || echo "komentar angka gagal"

      # Pratinjau untuk pemeriksa: screenshot dikecilkan jadi JPEG lalu ditempel
      # base64 di komentar commit (artefak & log GitHub tidak bisa diunduh dari
      # luar CI). Satu gambar = satu komentar supaya tidak kena batas 64 KB.
      # JPEG-nya dibuat di pekerjaan render (mereka punya Godot), bukan di sini.
      - name: Pratinjau render (komentar commit)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          JPGS=(artifacts/preview-*/*.jpg)
          if [ ${#JPGS[@]} -eq 0 ]; then
            echo "tidak ada pratinjau untuk dikirim"
            exit 0
          fi
          for jpg in "${JPGS[@]}"; do
            [ -f "$jpg" ] || continue
            SIZE=$(stat -c%s "$jpg")
            # Lewati yang terlalu besar: satu komentar maksimal 64 KB.
            [ "$SIZE" -le 42000 ] || { echo "lewat: $jpg ($SIZE B)"; continue; }
            NAME="$(basename "$(dirname "$jpg")")/$(basename "$jpg")"
            {
              echo "### pratinjau: $NAME"
              echo
              echo '```'
              base64 -w 0 "$jpg"
              echo
              echo '```'
            } > body.md
            jq -Rs '{body: .}' body.md > body.json
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              --input body.json --jq '.html_url' || echo "komentar $NAME gagal"
          done

      # Log GitHub (API) tidak bisa diunduh dari luar, dan anotasi hanya
      # memuat 25-60 baris terakhir. Jadi saat gagal, seluruh log dikirim
      # sebagai komentar commit supaya bisa dibaca utuh.
      - name: Ringkasan kegagalan
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for log in alllogs/*.log; do
            [ -f "$log" ] || continue
            echo "::error::--- $log"
            tail -25 "$log" | while IFS= read -r line; do echo "::error::$line"; done
          done
          {
            echo "### Log lengkap (run $GITHUB_RUN_ID, commit \`${GITHUB_SHA:0:7}\`)"
            echo
            for log in alllogs/*.log; do
              [ -f "$log" ] || continue
              echo '```'
              echo "=== $log ==="
              tail -c 24000 "$log"
              echo '```'
            done
          } > comment.md
          head -c 60000 comment.md > comment-cut.md
          mv comment-cut.md comment.md
          jq -Rs '{body: .}' comment.md > comment.json
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --input comment.json --jq '.html_url' || echo "komentar gagal dikirim"

  # --------------------------------------------------------------- build ----
  # Gerbang agregat: lolos hanya kalau SEMUA pekerjaan di atas lolos.
  # Kenapa ada: build lama satu pekerjaan bernama `build`, dan nama itu bisa
  # dipakai sebagai required status check. Setelah dipecah paralel, job ini
  # yang mempertahankan nama itu supaya perlindungan branch tidak perlu diubah.
  build:
    name: build
    needs: [gate, render-a, render-b, render-c, package]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Semua gerbang lolos?
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
              || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::ada pekerjaan yang gagal — lihat gate/render/package di atas"
            exit 1
          fi
          echo "semua gerbang lolos (gate, render-a, render-b, render-c, package)"

