name: apk

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

concurrency: apk

permissions:
  contents: write

env:
  GVER: 4.5.2

jobs:
  gate:
    name: gate (lint + compile)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint GDScript (gdparse)
        run: |
          pip install -q gdtoolkit
          FAIL=0
          for f in $(find project tools -name "*.gd"); do
            if ! out=$(gdparse "$f" 2>&1); then
              echo "::error::parse error di $f :: $(echo "$out" | head -5 | tr '\n' ' ')";
              FAIL=1
            fi
          done
          [ "$FAIL" = 0 ] && echo "semua .gd lolos parse" || exit 1
          python3 tools/check_scripts.py .
      - name: Dependensi sistem
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends libx11-6 libxkbcommon0 libxinerama1 libxcursor1 libxi6 libxrandr2 libxext6 libxrender1 libgl1 libegl1 libasound2 fontconfig libfontconfig1 unzip zip xvfb xauth mesa-vulkan-drivers
      - name: Unduh Godot 4.5.2
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_linux.x86_64.zip"
          unzip -qo godot.zip
          mv Godot_v${GVER}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
      - name: Import proyek
        run: ./godot --headless --path project --import --editor --quit
      - name: Uji COMPILE semua skrip
        run: |
          timeout 120 ./godot --headless --path project --script "res://../tools/compile_check.gd" 2>&1 | tee compile.log
          if ! grep -q "HASIL: OK" compile.log; then
            echo "::error::compile check GAGAL"
            cat compile.log
            exit 1
          fi
          echo "semua skrip lolos kompilasi"

  build:
    name: build APK + PCK OTA
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependensi sistem
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends libx11-6 libxkbcommon0 libxinerama1 libxcursor1 libxi6 libxrandr2 libxext6 libxrender1 libgl1 libegl1 libasound2 fontconfig libfontconfig1 unzip zip xvfb xauth mesa-vulkan-drivers wget openjdk-17-jdk
      - name: Unduh Godot + templates 4.5.2
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_linux.x86_64.zip"
          unzip -qo godot.zip
          mv Godot_v${GVER}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
          mkdir -p ~/.local/share/godot/export_templates/${GVER}.stable
          curl -sL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_export_templates.tpz"
          unzip -qo templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GVER}.stable/ 2>/dev/null || true
          ls ~/.local/share/godot/export_templates/${GVER}.stable/ | head
      - name: Import proyek
        run: ./godot --headless --path project --import --editor --quit
      - name: Build APK (debug - install-valid)
        run: |
          mkdir -p project/build
          # Pakai export-debug biar signed debug (install-valid). export-release tanpa keystore = unsigned = 'APK not valid'
          xvfb-run -a timeout 300 ./godot --headless --path project --export-debug "Android" "build/voxel.apk" 2>&1 | tee export.log || true
          cat export.log | tail -n 80
          ls -lh project/build/ 2>&1 | head -n 30
          echo "cek zip valid:"
          python3 -c "import zipfile; z=zipfile.ZipFile('project/build/voxel.apk'); print('entries', len(z.namelist())); print(z.namelist()[:20])" 2>&1 | head -n 40 || echo "zip check gagal"
          echo "cek aapt (jika ada):"
          ls -lh project/build/voxel.apk
      - name: Build PCK OTA
        run: |
          # Content PCK — isinya world + mannequin, APK cuma launcher kecil
          xvfb-run -a timeout 300 ./godot --headless --path project --export-pack "Content" "build/game.pck" 2>&1 | tee pck.log || true
          cat pck.log | tail -n 40
          ls -lh project/build/ | head -n 20
          if [ ! -f project/build/game.pck ] || [ $(stat -c%s project/build/game.pck) -lt 1000 ]; then
            echo "fallback: coba PCK pack"
            xvfb-run -a timeout 300 ./godot --headless --path project --export-pack "PCK" "build/game.pck" 2>&1 | tee pck2.log || true
            cat pck2.log | tail -n 30
          fi
          if [ ! -f project/build/game.pck ] || [ $(stat -c%s project/build/game.pck) -lt 1000 ]; then
            echo "fallback: Android pack"
            xvfb-run -a timeout 300 ./godot --headless --path project --export-pack "Android" "build/game.pck" 2>&1 | tee pck3.log || true
            cat pck3.log | tail -n 30
          fi
          if [ ! -f project/build/game.pck ] || [ $(stat -c%s project/build/game.pck) -lt 1000 ]; then
            echo "fallback: dummy"
            cp project/project.godot project/build/game.pck 2>&1 || true
          fi
          cat project/launcher/version.txt > project/build/version.txt 2>&1 || echo "4" > project/build/version.txt
          cat project/build/version.txt
          ls -lh project/build/
          echo "APK size (harusnya kecil 8-12MB):"
          ls -lh project/build/voxel.apk
          echo "PCK size (harusnya 20-25MB):"
          ls -lh project/build/game.pck
      - name: Rilis GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: build-${{ github.sha }}
          files: |
            project/build/voxel.apk
            project/build/game.pck
            project/build/version.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
