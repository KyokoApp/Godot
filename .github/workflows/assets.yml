name: publish-assets
# Terbitkan aset biner besar ke lampiran rilis GitHub (tag `assets-v1`) supaya
# repo tetap ringan. Berkasnya diambil dari riwayat git (commit yang masih
# memuatnya), jadi tidak perlu diunggah manual dari komputer.
#
# Jalan otomatis saat berkas pemicu diubah, dan bisa dipanggil manual:
#   gh workflow run publish-assets --ref <branch>

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/publish_assets.trigger"
      - ".github/workflows/assets.yml"

concurrency: publish-assets

permissions:
  contents: write

env:
  ASSET_TAG: assets-v1

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kumpulkan berkas biner dari riwayat
        run: |
          set -euo pipefail
          COMMIT=0d56df0d77cde7de8df8f31194815e90fee294aa
          mkdir -p dist
          git show "$COMMIT:project/assets/mannequin/UAL1_Standard.glb" \
            > dist/UAL1_Standard.glb
          git show "$COMMIT:project/assets/combat/UAL2_Standard.glb" \
            > dist/UAL2_Standard.glb
          ls -la dist
          # Jaring pengaman: berkas kosong/terpotong jangan sampai diterbitkan.
          # Beberapa tekstur memang kecil (ramp bayangan 504 bita), jadi ambang
          # dipisah: model besar wajib > 1 MB, tekstur > 100 bita.
          for f in dist/*; do
            size=$(stat -c%s "$f")
            case "$f" in
              *.fbx|*.glb)
                if [ "$size" -lt 1000000 ]; then
                  echo "::error::$f terlalu kecil ($size bita)"
                  exit 1
                fi
                ;;
              *)
                if [ "$size" -lt 100 ]; then
                  echo "::error::$f terlalu kecil ($size bita)"
                  exit 1
                fi
                ;;
            esac
          done
          echo "total: $(du -sh dist | cut -f1), $(ls -1 dist | wc -l) berkas"

      - name: Terbitkan / perbarui rilis aset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Aset biner A-Sekai: pustaka animasi UAL1/UAL2.
          
          Diunduh otomatis oleh \`tools/fetch_assets.sh\` (dipakai CI sebelum import proyek).
          Berkas ini tidak disimpan di git supaya repo tetap ringan; sumbernya ada di
          riwayat commit 0d56df0."
          if ! gh release view "$ASSET_TAG" >/dev/null 2>&1; then
            gh release create "$ASSET_TAG" \
              --title "Aset biner (pustaka animasi UAL)" \
              --notes "$NOTES"
          fi
          gh release upload "$ASSET_TAG" dist/* --clobber
          gh release view "$ASSET_TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size)"'
